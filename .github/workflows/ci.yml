name: ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install ".[dev]"
      - name: lint + repository rules (secrets, gigsim unchanged, prompts, README numbers)
        run: python scripts/run.py lint
      - name: unit, MCP, contract (schema snapshots) and integration tests
        run: python -m pytest -q
        env: {PYTHONPATH: ., GIGBID_PROFILE: offline}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install "."
      - name: typed client is up to date with the API
        run: |
          PYTHONPATH=. GIGSIM_URL=inprocess python -c "import json;from apps.api.main import app;print(json.dumps(app.openapi(),indent=1))" > /tmp/openapi.json
          diff <(python -m json.tool apps/api/openapi.json) <(python -m json.tool /tmp/openapi.json)
      - working-directory: apps/web
        run: npm ci || npm install
      - working-directory: apps/web
        run: npm run build && npx playwright install --with-deps chromium
      - name: start API (offline profile, in-process GigSim + worker)
        run: |
          PYTHONPATH=. GIGBID_PROFILE=offline GIGSIM_URL=inprocess GIGSIM_ERROR_RATE=0 GIGSIM_SPEED=60 \
          REVIEWER_PASSWORD=reviewer-pass-123 SECRET_KEY=ci-secret-key-ci-secret-key-ci-secret \
          nohup python -m uvicorn apps.api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 90); do curl -fs localhost:8000/api/health && break; sleep 2; done
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
        env: {E2E_BASE_URL: "http://localhost:8000"}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: apps/web/playwright-report}