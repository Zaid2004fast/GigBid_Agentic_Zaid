[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid - a multi-agent freelancer copilot (LangGraph, MCP, advanced RAG)"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.20",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langgraph-supervisor==0.0.31",
  "langchain-core==1.7.6",
  "langchain-mcp-adapters==0.3.2",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.7.4",
  "mcp==1.30.0",
  "fastapi==0.162.2",
  "uvicorn==0.53.0",
  "sse-starlette==3.7.0",
  "pydantic[email]==2.13.4",
  "pyyaml==6.0.3",
  "numpy==2.4.6",
  "rank-bm25==0.2.2",
  "fastembed>=0.7,<0.9",
  "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.20",
  "psycopg[binary,pool]==3.3.8",
  "httpx==0.28.1",
  "cryptography==49.0.0",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.12",
  "pypdf>=5.0",
  "arq==0.28.0",
  "redis>=5.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff>=0.7", "reportlab>=4.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["apps/web", "data/personas"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B023", "E731", "B905", "E741"]
[tool.setuptools.packages.find]
include = ["agent*", "rag*", "apps*", "mcp_servers*", "worker*", "evals*", "common*", "gigsim*", "data*"]
exclude = ["apps.web*"]
